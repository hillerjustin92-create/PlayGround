<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04080f">
<meta name="description" content="NEXUS//SIM — a full-spectrum simulation environment with root admin access, autonomous agent loops, skill synthesis and coordinated missions.">
<title>NEXUS//SIM — Full-Spectrum Simulation Environment</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
  <symbol id="i-agents" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6A4.6 4.6 0 0 1 20.5 19"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5 14 9l6.5 2-6.5 2-2 6.5L10 13l-6.5-2L10 9z"/><path d="M19 3v3M17.5 4.5h3"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.7L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.7L21 15"/><path d="M21 20v-5h-5"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 5.5 1.6 1.6L7 4.5M3 11.5l1.6 1.6L7 10.5M3 17.5l1.6 1.6L7 16.5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 2.4 4.2 5.4 4.2 9S14.8 18.6 12 21c-2.8-2.4-4.2-5.4-4.2-9S9.2 5.4 12 3Z"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M12.5 15H17"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.4" y="5" width="3.6" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
  <symbol id="i-tilt" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M2.5 8.5 5 11l2.5-2.5M21.5 15.5 19 13l-2.5 2.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></symbol>
  <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/><path d="M5 11.5v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></symbol>
  <symbol id="i-data" viewBox="0 0 24 24"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Z"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<canvas id="scene" aria-label="Interactive holographic network map. Drag to orbit, scroll to zoom, tap a node to inspect it."></canvas>
<div class="scene-vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><span>N</span><i></i></div>
    <div class="brand-text">
      <strong>NEXUS<span>//SIM</span></strong>
      <small>FULL-SPECTRUM ENVIRONMENT</small>
    </div>
  </div>

  <div class="status-cluster">
    <button class="pill admin-pill" id="adminPill" title="Root access is active on every system">
      <span class="dot"></span>ROOT ADMIN
    </button>
    <button class="pill net-pill" id="netPill" title="Internet uplink status">
      <span class="dot"></span><span id="netPillText">NET ONLINE</span>
    </button>
    <div class="pill clock-pill" id="simClock" title="Simulation clock">T+00:00:00</div>
  </div>

  <div class="resource-strip" id="resourceStrip" aria-label="Simulation resources"></div>

  <div class="top-actions">
    <button class="icon-btn" id="soundBtn" aria-label="Toggle sound" title="Toggle sound">
      <svg><use href="#i-mute"/></svg>
    </button>
    <button class="icon-btn text-btn" id="speedBtn" title="Simulation speed">1×</button>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause simulation" title="Pause / resume (Space)">
      <svg><use href="#i-pause"/></svg>
    </button>
    <button class="icon-btn" id="saveBtn" aria-label="Save simulation" title="Save state">
      <svg><use href="#i-save"/></svg>
    </button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Sections"></nav>

<main class="stage" id="stage">
  <div class="hud hud-top">
    <div class="hud-kicker">SECTOR NEXUS-7 <span>// LIVE TOPOLOGY</span></div>
    <div class="hud-stats" id="hudStats"></div>
  </div>

  <div class="hud legend" id="legend" aria-hidden="true">
    <span><i style="--c:#56e1ff"></i>ONLINE</span>
    <span><i style="--c:#ffcf6b"></i>DEGRADED</span>
    <span><i style="--c:#ff5f8f"></i>LOCKED</span>
    <span><i style="--c:#64748b"></i>OFFLINE</span>
  </div>

  <div class="scene-hint" id="sceneHint">
    <span class="mouse">DRAG TO ORBIT</span>
    <span class="touch">SWIPE TO ORBIT</span>
    <span>SCROLL / PINCH TO ZOOM</span>
    <span>TAP A NODE</span>
  </div>

  <div class="joystick" id="joystick" aria-label="Virtual camera joystick">
    <div class="joystick-ring"></div>
    <div class="joystick-knob" id="joystickKnob"></div>
    <span class="joystick-label">VIEW</span>
  </div>

  <div class="stage-controls" aria-label="Camera controls">
    <button class="stage-btn" data-act="zoom-in" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
    <button class="stage-btn" data-act="zoom-out" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
    <button class="stage-btn" data-act="reset" aria-label="Reset view"><svg><use href="#i-target"/></svg></button>
    <button class="stage-btn tilt-btn" id="tiltBtn" aria-label="Enable accelerometer tilt" title="Optional accelerometer tilt">
      <svg><use href="#i-tilt"/></svg><span>TILT</span>
    </button>
  </div>

  <div class="mobile-hud" id="mobileHud"></div>
  <div class="node-tooltip" id="tooltip" role="status"></div>
</main>

<aside class="panel" id="panel" aria-label="Control panel">
  <div class="panel-head">
    <div>
      <small id="panelKicker">COMMAND</small>
      <h2 id="panelTitle">Overview</h2>
    </div>
    <div class="panel-head-actions">
      <span class="panel-live"><i></i>LIVE</span>
      <button class="icon-btn panel-close" id="panelClose" aria-label="Close panel"><svg><use href="#i-close"/></svg></button>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>
<div class="backdrop" id="backdrop"></div>

<nav class="mobile-nav" id="mobileNav" aria-label="Mobile sections"></nav>

<section class="terminal-drawer" id="terminalDrawer" aria-label="Root terminal">
  <div class="term-head">
    <div class="term-dots"><i></i><i></i><i></i></div>
    <span class="term-title">root@nexus — /dev/sim <b>UID 0</b></span>
    <button class="icon-btn" id="termClose" aria-label="Close terminal"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="term-body" id="termBody" aria-live="polite"></div>
  <form class="term-form" id="termForm" autocomplete="off">
    <label for="termInput">root@nexus:~#</label>
    <input id="termInput" name="command" type="text" spellcheck="false" autocapitalize="off" placeholder="type 'help' — full admin shell" aria-label="Terminal command">
    <button type="submit" class="term-send" aria-label="Run command"><svg><use href="#i-arrow"/></svg></button>
  </form>
  <div class="term-hint">Tab suggests · ↑↓ history · Ctrl+L clear · Esc close</div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
